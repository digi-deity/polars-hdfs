[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "polars-hdfs"
version = "0.1.1"
description = "Read HDFS paths with polars"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "digi-deity", email = "git@laurens.xyz" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "polars>=1.38.1",
    "hdfs-s3-gateway>=0.3.4",
]

[project.urls]
Homepage = "https://github.com/digi-deity/polars-hdfs"
Repository = "https://github.com/digi-deity/polars-hdfs"
Issues = "https://github.com/digi-deity/polars-hdfs/issues"
Changelog = "https://github.com/digi-deity/polars-hdfs/releases"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
]
# Used by tests/integration to seed fixtures into a live HDFS cluster.
integration = [
    "hdfs-native>=0.14.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: needs live HDFS clusters; set POLARS_HDFS_TEST_URI to run",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = ["hdfs_s3_gateway.*"]
ignore_missing_imports = true
